[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-checks"
version = "0.1.0"
description = "CLI tools for sitemap, metadata, content, and structured data checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Victor Valentine Romo"}]
dependencies = [
  "click==8.5.0",
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "certifi",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]
link-suggest = ["torch==2.14.1", "transformers==5.18.0", "rapidfuzz==3.14.6"]

[project.scripts]
seo-checks = "seo_checks:main"

[project.urls]
Homepage = "https://scalewithsearch.com/code/seo-checks"
Repository = "https://github.com/b2bvic/seo-checks"

[tool.setuptools]
py-modules = ["seo_checks"]

[tool.setuptools.data-files]
"share/seo-checks/sitemap-check" = ["components/sitemap-check/sitemap-check", "components/sitemap-check/README.md", "components/sitemap-check/LICENSE"]
"share/seo-checks/robots-check" = ["components/robots-check/robots-check", "components/robots-check/README.md", "components/robots-check/LICENSE"]
